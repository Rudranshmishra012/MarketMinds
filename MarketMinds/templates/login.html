{% extends "base.html" %}
{% block title %}Login - MarketMinds{% endblock %}

{% block content %}
<div class="page-header text-center">
  <h1>Welcome Back</h1>
  <p>Log in to continue to your MarketMinds dashboard.</p>
</div>

<div class="card" style="max-width:440px; margin:0 auto;">
  <form method="POST" action="{{ url_for('login') }}">
    <div class="form-group">
      <label for="identifier">Email or Mobile Number</label>
      <input type="text" class="form-control" id="identifier" name="identifier" required
             value="{{ form_data.get('identifier', '') }}" placeholder="you@example.com or mobile number">
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" class="form-control" id="password" name="password" required placeholder="Your password">
    </div>
    <button type="submit" class="btn btn-primary btn-block">Log In</button>
  </form>

  <p class="text-center" style="margin-top:16px; color:var(--text-muted); font-size:0.9rem;">
    New to MarketMinds? <a href="{{ url_for('register') }}" style="color:var(--primary-dark); font-weight:600;">Create an account</a>
  </p>

</div>
{% endblock %}
